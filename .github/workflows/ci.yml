name: '🏗 Build & Package'
run-name: >-
  ${{ github.event_name == 'pull_request' &&
      format('🏗 {0} - {1} → {2} by {3}', github.event_name, github.head_ref, github.base_ref, github.actor) ||
      format('🏗 {0} - {1} - {2} by {3}', github.event_name, github.ref_name, github.sha, github.actor) }}

on:
  push:
    branches: [main]
    paths-ignore: ['.github/ISSUE_TEMPLATE/**']
  pull_request:
    branches: [main]
    paths-ignore: ['.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  XCODE_APP: '/Applications/Xcode_26.5.app'
  IOS_SDK_VERSION: '26.5'       # iphoneos SDK — xcodebuild -showsdks; must match Laerdal.Scripts/Laerdal.targets' TargetPlatformVersion
  MACOS_SDK_VERSION: '26.5'     # macosx SDK   — xcodebuild -showsdks; must match Laerdal.Scripts/Laerdal.targets' TargetPlatformVersion

jobs:
  version:
    name: '🔢 Compute version'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: '🔄 Checkout'
        uses: actions/checkout@v7

      - name: '📐 Read Nordic package version'
        id: nordic-version
        run: |
          VERSION=$(sed -n 's/.*<Nordic_Package_Version[^>]*>\([0-9.]*\)<\/Nordic_Package_Version>.*/\1/p' Laerdal.Scripts/Laerdal.targets | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract Nordic_Package_Version from Laerdal.Scripts/Laerdal.targets"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: '🔢 Compute version'
        id: version
        run: |
          # Package version tracks the wrapped Nordic native library: {Nordic_Package_Version}.{revision}.
          # The revision is derived from the highest already-published revision on NuGet.org (not
          # GITHUB_RUN_NUMBER) so it survives workflow-file replacements/renames without regressing
          # below, or colliding with, a version that's already live.
          NORDIC_PACKAGE_VERSION="${{ steps.nordic-version.outputs.version }}"

          VERSIONS_JSON=$(curl -sf 'https://api.nuget.org/v3-flatcontainer/laerdal.dfu.bindings.ios/index.json' || echo '{"versions":[]}')

          LATEST_REVISION=$(echo "$VERSIONS_JSON" | jq -r --arg prefix "${NORDIC_PACKAGE_VERSION}." '
            [ .versions[] | select(startswith($prefix)) | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$")) | split(".")[3] | tonumber ] | max // empty')

          if [ -z "$LATEST_REVISION" ]; then
            # first release under a freshly-bumped Nordic version - float above every revision published so far
            LATEST_REVISION=$(echo "$VERSIONS_JSON" | jq -r '
              [ .versions[] | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$")) | split(".")[3] | tonumber ] | max // 0')
          fi

          VERSION="${NORDIC_PACKAGE_VERSION}.$((LATEST_REVISION + 1))"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "### 🔢 Version: \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: '🏗️ Build & Pack'
    runs-on: macos-26 # macos-15's newest Xcode is 26.3 (SDK 26.2) - doesn't have the 26.5 SDK this repo needs
    timeout-minutes: 60
    needs: version
    steps:
      - name: '🔄 Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: '🍎 Select Xcode'
        run: sudo xcode-select -s '${{ env.XCODE_APP }}/Contents/Developer'

      - name: '🔧 Setup .NET'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: '📲 Restore .NET workloads'
        uses: laerdal/github_actions/dotnet@main
        with:
          command: workload
          arguments: restore '${{ github.workspace }}/Laerdal.Dfu.Bindings.iOS.sln'
          show-summary: true

      - name: '🍺 Install Carthage'
        run: brew install carthage

      - name: '🔨 Build & Pack'
        run: |
          dotnet msbuild Laerdal.Scripts/Laerdal.Builder.targets \
            /m:1 \
            -p:Configuration=Release \
            -p:PackageOutputPath='${{ github.workspace }}/Artifacts' \
            -p:Laerdal_Version_Full='${{ needs.version.outputs.version }}' \
            -p:Laerdal_Github_Access_Token='${{ secrets.GITHUB_TOKEN }}' \
            -p:Laerdal_Bindings_iOS___Sdk_Version='${{ env.IOS_SDK_VERSION }}' \
            -p:Laerdal_Bindings_iOS___Xcode_Ide_Dev_Path='${{ env.XCODE_APP }}/Contents/Developer' \
            -p:Laerdal_Bindings_MacCatalyst___Sdk_Version='${{ env.MACOS_SDK_VERSION }}' \
            -p:Laerdal_Bindings_MacCatalyst___Xcode_Ide_Dev_Path='${{ env.XCODE_APP }}/Contents/Developer'

      - name: '📦 Upload NuGet packages'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: '${{ github.workspace }}/Artifacts/**/*.nupkg'
          if-no-files-found: error

      - name: '📄 Generate CycloneDX SBOM'
        uses: laerdal/github_actions/dotnet-cyclonedx@main
        with:
          path: '${{ github.workspace }}/Laerdal.Dfu.Bindings.iOS.sln'
          output: '${{ github.workspace }}/Artifacts'
          filename: 'Laerdal.Dfu.Bindings.iOS.cyclonedx.json'
          output-format: 'Json'
          set-name: 'Laerdal.Dfu.Bindings.iOS'
          set-version: '${{ needs.version.outputs.version }}'
          show-summary: true

      - name: '📦 Upload SBOM'
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: '${{ github.workspace }}/Artifacts/Laerdal.Dfu.Bindings.iOS.cyclonedx.json'
          if-no-files-found: error

  publish-nuget:
    name: '🚀 Publish to NuGet.org'
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: nuget-org
    steps:
      - name: '📦 Download NuGet packages'
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - name: '🚀 Push to NuGet.org'
        uses: laerdal/github_actions/dotnet-nuget-upload@main
        with:
          package-path: 'packages/*.nupkg'
          api-key: ${{ secrets.NUGET_ORG_API_KEY }}
          source: 'https://api.nuget.org/v3/index.json'
          skip-duplicate: true
          show-summary: true

  tag-and-release:
    name: '🏷️ Tag & Release'
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [version, publish-nuget]
    steps:
      - name: '🔄 Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: '⬇️ Download SBOM'
        uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom

      - name: '🚀 Create GitHub Release'
        uses: laerdal/github_actions/github-release@main
        with:
          tag: ${{ needs.version.outputs.version }}
          title: 'Release ${{ needs.version.outputs.version }}'
          generate-notes: 'true'
          assets: 'sbom/Laerdal.Dfu.Bindings.iOS.cyclonedx.json'
          show-summary: 'true'
