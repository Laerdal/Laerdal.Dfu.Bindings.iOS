name: CI
run-name: >-
  ${{ github.event_name == 'pull_request' &&
      format('🏗 {0} - {1} → {2} by {3}', github.event_name, github.head_ref, github.base_ref, github.actor) ||
      format('🏗 {0} - {1} - {2} by {3}', github.event_name, github.ref_name, github.sha, github.actor) }}

on:
  push:
    branches: [main, master]
    paths-ignore: ['.github/ISSUE_TEMPLATE/**']
  pull_request:
    branches: [main, master]
    paths-ignore: ['.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  packages: write
  actions: read
  checks: write
  id-token: write
  pull-requests: write
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NORDIC_PACKAGE_VERSION: '4.16.0'
  XCODE_APP: '/Applications/Xcode_16.1.app'
  IOS_SDK_VERSION: '18.1'       # iphoneos SDK — xcodebuild -showsdks
  MACOS_SDK_VERSION: '15.1'     # macosx SDK   — xcodebuild -showsdks

jobs:
  build:
    name: '🛠️ Build & Package'
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: '🔄 Checkout'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: '🔢 Compute version'
        id: version
        run: |
          REVISION=$(( 43857 + $GITHUB_RUN_NUMBER ))
          echo "version=${{ env.NORDIC_PACKAGE_VERSION }}.${REVISION}" >> "$GITHUB_OUTPUT"

      - name: '🍎 Select Xcode'
        run: sudo xcode-select -s '${{ env.XCODE_APP }}/Contents/Developer'

      - name: '🔧 Setup .NET'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: '📲 Restore .NET workloads'
        uses: laerdal/github_actions/dotnet@main
        with:
          command: workload
          arguments: restore '${{ github.workspace }}/Laerdal.Dfu.Bindings.iOS.sln'
          show-summary: true

      - name: '🍺 Install Carthage'
        run: brew install carthage

      - name: '🏗️ Build & Package'
        run: |
          dotnet msbuild Laerdal.Scripts/Laerdal.Builder.targets \
            /m:1 \
            -p:Configuration=Release \
            -p:PackageOutputPath='${{ github.workspace }}/Artifacts' \
            -p:Laerdal_Version_Full='${{ steps.version.outputs.version }}' \
            -p:Laerdal_Github_Access_Token='${{ secrets.GITHUB_TOKEN }}' \
            -p:Laerdal_Bindings_iOS___Sdk_Version='${{ env.IOS_SDK_VERSION }}' \
            -p:Laerdal_Bindings_iOS___Xcode_Ide_Dev_Path='${{ env.XCODE_APP }}/Contents/Developer' \
            -p:Laerdal_Bindings_MacCatalyst___Sdk_Version='${{ env.MACOS_SDK_VERSION }}' \
            -p:Laerdal_Bindings_MacCatalyst___Xcode_Ide_Dev_Path='${{ env.XCODE_APP }}/Contents/Developer'

      - name: '📦 Upload NuGet packages'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: '${{ github.workspace }}/Artifacts/**/*.nupkg'
          if-no-files-found: error

  publish-github-packages:
    name: '🚀 Publish to GitHub Packages'
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: '📦 Download NuGet packages'
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: '🚀 Push to GitHub Packages'
        uses: laerdal/github_actions/dotnet-nuget-upload@main
        with:
          package-path: 'packages/*.nupkg'
          api-key: ${{ secrets.GITHUB_TOKEN }}
          source: 'https://nuget.pkg.github.com/Laerdal/index.json'
          skip-duplicate: true
          show-summary: true

  publish-nuget:
    name: '🚀 Publish to NuGet.org'
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: nuget-org
    steps:
      - name: '📦 Download NuGet packages'
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: '🚀 Push to NuGet.org'
        uses: laerdal/github_actions/dotnet-nuget-upload@main
        with:
          package-path: 'packages/*.nupkg'
          api-key: ${{ secrets.NUGET_ORG_API_KEY }}
          source: 'https://api.nuget.org/v3/index.json'
          skip-duplicate: true
          show-summary: true

  tag-and-release:
    name: '🏷️ Tag & Release'
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: [build, publish-nuget]
    steps:
      - name: '🔄 Checkout'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: '🚀 Create GitHub Release'
        uses: laerdal/github_actions/github-release@main
        with:
          tag: ${{ needs.build.outputs.version }}
          title: 'Release ${{ needs.build.outputs.version }}'
          generate-notes: 'true'
          show-summary: 'true'
